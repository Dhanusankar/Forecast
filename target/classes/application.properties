spring.application.name=forecast-system
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
server.port=8080
logging.level.root=INFO
logging.level.com.forecast=DEBUG

jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurposeThisIsAVeryLongSecretKeyThatIsAtLeast512BitsLongForHS512AlgorithmCompliance1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz
jwt.expiration=86400000
